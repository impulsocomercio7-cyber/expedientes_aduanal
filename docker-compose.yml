services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - "8080:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-expedientes_aduanal}
      DB_USER: ${DB_USER:-expedientes_app}
      DB_PASS: ${DB_PASSWORD:-CAMBIAR_ESTA_CLAVE}
      APP_NAME: ${APP_NAME:-Expedientes Aduanales}
      BASE_URL: ${BASE_URL:-}
      STORAGE_PATH: /var/www/html/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SESSION_NAME: expedientes_aduanal_session
    volumes:
      - documentos_storage:/var/www/html/storage
    networks:
      - expedientes_net

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-expedientes_aduanal}
      MYSQL_USER: ${DB_USER:-expedientes_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CAMBIAR_ESTA_CLAVE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CAMBIAR_CLAVE_ROOT}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - expedientes_net

volumes:
  mysql_data:
  documentos_storage:

networks:
  expedientes_net:
    driver: bridge
